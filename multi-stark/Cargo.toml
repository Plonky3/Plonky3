[package]
name = "p3-multi-stark"
description = "Multilinear (SuperSpartan-style) STARK prover for AIRs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-multilinear-util/parallel",
    "p3-sumcheck/parallel",
]

[dependencies]
hashbrown.workspace = true
itertools.workspace = true
p3-air.workspace = true
p3-bus.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-field.workspace = true
p3-lookup.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-multilinear-util.workspace = true
p3-security.workspace = true
p3-sumcheck.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
p3-baby-bear = { path = "../baby-bear" }
p3-binary-field = { path = "../binary-field" }
p3-binary-pcs = { path = "../binary-pcs" }
p3-blake3-air = { path = "../blake3-air" }
p3-bus = { path = "../bus", features = ["diagnostics"] }
p3-dft = { path = "../dft" }
p3-keccak = { path = "../keccak" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-monty-31 = { path = "../monty-31" }
p3-poseidon2-air = { path = "../poseidon2-air" }
p3-whir = { path = "../whir" }
proptest.workspace = true
rand = { workspace = true }
tracing-forest = { workspace = true, features = ["ansi", "smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }

[[example]]
name = "prove_binary_field"
test = true

[[example]]
name = "prove_boolean_trace"
test = true

[[bench]]
name = "poseidon2"
harness = false

[[bench]]
name = "zerocheck"
harness = false

[lints]
workspace = true
