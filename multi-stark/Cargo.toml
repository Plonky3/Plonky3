[package]
name = "p3-multi-stark"
description = "Multilinear (SuperSpartan-style) STARK prover for AIRs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-multilinear-util/parallel",
    "p3-sumcheck/parallel",
]

[dependencies]
itertools.workspace = true
p3-air.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-field.workspace = true
p3-lookup.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-multilinear-util.workspace = true
p3-security.workspace = true
p3-sumcheck.workspace = true
p3-util.workspace = true
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-monty-31.workspace = true
criterion.workspace = true
p3-baby-bear = { path = "../baby-bear" }
p3-binary-field.workspace = true
p3-binary-pcs.workspace = true
p3-blake3-air.workspace = true
p3-dft.workspace = true
p3-keccak.workspace = true
p3-merkle-tree.workspace = true
p3-poseidon2-air.workspace = true
p3-symmetric.workspace = true
p3-whir.workspace = true
postcard = { workspace = true, features = ["alloc"] }
proptest.workspace = true
rand = { workspace = true }
tracing-forest = { workspace = true, features = ["ansi", "smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }

[[example]]
name = "prove_binary_field"
test = true

[[bench]]
name = "poseidon2"
harness = false

[[bench]]
name = "zerocheck"
harness = false

[lints]
workspace = true
