[package]
name = "p3-ccs"
description = "Customizable constraint systems over structured matrices, reduced to one witness evaluation by SuperSpartan."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]

[dependencies]
p3-challenger.workspace = true
p3-field.workspace = true
p3-maybe-rayon.workspace = true
p3-multilinear-util.workspace = true
p3-sumcheck.workspace = true

serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear" }
p3-binary-field = { path = "../binary-field" }
p3-commit = { path = "../commit" }
p3-dft = { path = "../dft" }
p3-keccak = { path = "../keccak" }
p3-matrix = { path = "../matrix" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-symmetric = { path = "../symmetric" }
p3-whir = { path = "../whir" }

criterion.workspace = true
proptest.workspace = true
rand = { workspace = true, features = ["std_rng"] }

[[bench]]
name = "reduction"
harness = false

[lints]
workspace = true
