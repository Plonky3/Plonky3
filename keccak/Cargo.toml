[package]
name = "p3-keccak"
description = "An optimized implementation of the Keccak-f permutation and the Keccak-256 and SHA3-256 hash functions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Criterion pulls Rayon transitively, which does not build for WASI.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[dependencies]
p3-symmetric.workspace = true
p3-util.workspace = true

tiny-keccak = { workspace = true, features = ["keccak", "sha3"] }

[dev-dependencies]
p3-field = { path = "../field" }
p3-mersenne-31 = { path = "../mersenne-31" }

hex-literal.workspace = true
proptest.workspace = true
sha3.workspace = true

[[bench]]
name = "bench_keccak"
harness = false

[lints]
workspace = true

