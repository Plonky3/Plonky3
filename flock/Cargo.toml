[package]
name = "p3-flock"
description = "Flock: batched Boolean R1CS proving over binary fields (ePrint 2026/1329)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemallocator.workspace = true

# Criterion pulls Rayon transitively, which does not build for WASI.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]

[dependencies]
hex-literal.workspace = true
p3-binary-dft.workspace = true
p3-binary-field.workspace = true
p3-binary-pcs.workspace = true
p3-challenger.workspace = true
p3-field.workspace = true
p3-keccak.workspace = true
p3-maybe-rayon.workspace = true
p3-multilinear-util.workspace = true
p3-security.workspace = true
p3-sumcheck.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true

serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-binary-field = { path = "../binary-field", features = ["test-utils"] }

blake2.workspace = true
blake3.workspace = true
postcard = { workspace = true, features = ["alloc"] }
proptest.workspace = true
rand = { workspace = true, features = ["std_rng"] }
sha2.workspace = true
tiny-keccak = { workspace = true, features = ["keccak"] }
tracing-forest = { workspace = true, features = ["ansi", "smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }

[[bench]]
name = "zerocheck"
harness = false

[[bench]]
name = "lincheck"
harness = false

[[bench]]
name = "witness"
harness = false

[lints]
workspace = true
