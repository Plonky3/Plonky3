[package]
name = "p3-gkr"
description = "Batched product-tree GKR reductions over any extension field."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Criterion pulls Rayon transitively, which does not build for WASI.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]

[dependencies]
p3-challenger.workspace = true
p3-field.workspace = true
p3-maybe-rayon.workspace = true
p3-multilinear-util.workspace = true
p3-sumcheck.workspace = true

serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear" }
p3-binary-field = { path = "../binary-field" }
p3-challenger = { path = "../challenger", features = ["test-utils"] }
p3-keccak = { path = "../keccak" }
p3-symmetric = { path = "../symmetric" }

postcard = { workspace = true, features = ["alloc"] }
rand.workspace = true
rand_xoshiro.workspace = true

[[bench]]
name = "gkr"
harness = false

[lints]
workspace = true
