name: Heavy CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [ "*" ]
    paths:
      - "whir/src/**"
      - "binary-pcs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  whir_exhaustive:
    name: WHIR exhaustive tests
    env:
      # Optimize the exhaustive sweep while retaining the test profile's
      # debug assertions and overflow checks.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Set flags
        if: ${{ matrix.features }}
        run: |
          # Append AVX2 to existing flags so we keep -C debuginfo=0.
          echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Test WHIR exhaustive sweep
        run: python3 scripts/check.py whir-exhaustive

      - name: Test WHIR exhaustive sweep with parallel
        run: python3 scripts/check.py whir-exhaustive --parallel

  binary_pcs_large_configuration:
    name: binary-pcs 2^16 round trip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Set flags
        # No x86_64 target carries carry-less multiply in its baseline, so without this the
        # runner falls back to recursive tower multiplication and the job measures that
        # instead. Appended to the existing flags so we keep -C debuginfo=0.
        run: echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=+pclmulqdq" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Test the 2^16 round trip
        run: python3 scripts/check.py binary-large
