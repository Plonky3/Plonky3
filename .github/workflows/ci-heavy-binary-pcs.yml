name: Heavy CI (binary-pcs large configuration)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  binary_pcs_large_configuration:
    name: binary-pcs 2^16 round trip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Select affected packages
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/check.py plan --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/check.py plan --full --github-output "$GITHUB_OUTPUT"
          fi

      - name: Set flags
        # No x86_64 target carries carry-less multiply in its baseline, so without this the
        # runner falls back to recursive tower multiplication and the job measures that
        # instead. Appended to the existing flags so we keep -C debuginfo=0.
        run: echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=+pclmulqdq" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.impact.outputs.binary_pcs == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the 2^16 round trip
        if: ${{ steps.impact.outputs.binary_pcs == 'true' }}
        run: python3 scripts/check.py binary-large
