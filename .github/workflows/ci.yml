name: CI

on:
  # Release-plz verifies CI on the post-merge commit of the base branch, so
  # push CI must run on every branch that can host a release: main, the
  # vX.Y.Z stable branches, and the X.Y.Z-rc.N release-candidate branches
  # created by create_release.sh (named after the rc version, no "v" prefix).
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
  # rustc 1.101.0-nightly 32dba69d6 (2026-10-09) panics while type-checking p3-binary-field.
  MIRI_TOOLCHAIN: nightly-2026-10-09

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.impact.outputs.packages }}
      rust: ${{ steps.impact.outputs.rust }}
      parallel: ${{ steps.impact.outputs.parallel }}
      embedded: ${{ steps.impact.outputs.embedded }}
      wasm: ${{ steps.impact.outputs.wasm }}
      wasm_blake3: ${{ steps.impact.outputs.wasm_blake3 }}
      keccak: ${{ steps.impact.outputs.keccak }}
      sha_ni: ${{ steps.impact.outputs.sha_ni }}
      gfni: ${{ steps.impact.outputs.gfni }}
      binary_field: ${{ steps.impact.outputs.binary_field }}
      avx512: ${{ steps.impact.outputs.avx512 }}
      vpclmulqdq: ${{ steps.impact.outputs.vpclmulqdq }}
      toml: ${{ steps.impact.outputs.toml }}
      manifests: ${{ steps.impact.outputs.manifests }}
      scripts: ${{ steps.impact.outputs.scripts }}
      lint: ${{ steps.impact.outputs.lint }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Select affected packages
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/check.py plan --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/check.py plan --full --github-output "$GITHUB_OUTPUT"
          fi

  build_and_test:
    name: Build and Test (${{ matrix.name }})
    needs: plan
    strategy:
      matrix:
        include:
          # `modes` selects which of the default and `parallel`-feature runs a leg
          # performs. A leg naming both runs them as sequential steps sharing one
          # warm target directory.
          - name: linux
            os: ubuntu-latest
            modes: serial
          - name: linux, parallel
            os: ubuntu-latest
            modes: parallel
          - name: linux, avx2
            os: ubuntu-latest
            features: "+avx2"
            modes: serial
          - name: linux, avx2, parallel
            os: ubuntu-latest
            features: "+avx2"
            modes: parallel
          # PCLMULQDQ is present on essentially every x86_64 CPU since ~2010, so the
          # carryless-multiply paths can be tested rather than merely compiled.
          - name: linux, pclmulqdq
            os: ubuntu-latest
            features: "+pclmulqdq"
            modes: serial parallel
          # The serial/parallel split belongs on the Linux legs above: it exercises
          # `maybe-rayon`, whose two backends do not vary by operating system. The
          # macOS and Windows legs run the `parallel` configuration consumers ship.
          - name: macos, parallel
            os: macos-latest
            modes: parallel
          - name: windows, parallel
            os: windows-latest
            modes: parallel
          # A leg's job name is its `name`, and most of them are required status
          # checks, so renaming one leaves a required check that is never reported.
          # New feature combinations go in legs of their own.
          - name: linux, avx512f, build only
            os: ubuntu-latest
            features: "+avx512f"
            # GitHub-hosted runners aren't guaranteed to have AVX-512 hardware,
            # so this leg only verifies the AVX-512 paths compile.
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # VPCLMULQDQ, the 256- and 512-bit carryless multiply, arrived with Ice Lake and
          # Zen 3. GitHub's runner pool still includes older parts, so these legs compile the
          # wide carryless-multiply paths rather than running them.
          #
          # A user-mode emulator is not a way around that. QEMU's translator decodes the
          # 128-bit carryless multiply only, so every test reaching a 256-bit product dies
          # on an illegal instruction. Executing these paths needs real silicon.
          - name: linux, avx2+vpclmulqdq, build only
            os: ubuntu-latest
            features: "+avx2,+vpclmulqdq"
            compile_only: true
            miri_clmul: true
            vpclmulqdq: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          - name: linux, avx512f+vpclmulqdq, build only
            os: ubuntu-latest
            features: "+avx512f,+vpclmulqdq"
            compile_only: true
            miri_clmul: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # `+avx512f` does not imply `+avx512vl`, yet every AVX-512 server with VPCLMULQDQ has it.
          # This leg compiles the 256-bit ternary-logic arm those servers run.
          - name: linux, avx512vl+vpclmulqdq, build only
            os: ubuntu-latest
            features: "+avx512f,+avx512vl,+vpclmulqdq"
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # No microarchitecture level enables `sha`, so nothing else compiles the
          # four-lane SHA-256 kernel. Runners vary, so only the build is guaranteed.
          - name: linux, sha, build only
            os: ubuntu-latest
            features: "+sha,+sse4.1"
            compile_only: true
            sha_ni: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # The byte-wise Galois-field instructions have a 128-bit form that needs no wide
          # register, and that form is the one no other leg compiles.
          - name: linux, gfni, build only
            os: ubuntu-latest
            features: "+gfni"
            compile_only: true
            gfni: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # `+avx512f` implies neither `+avx512bw` nor `+gfni`, so every other leg
          # compiles the scalar stub in place of the blocked change-of-basis kernel.
          # `+avx512vbmi` adds the byte permute the sliced zerocheck's plane-fold transposes need.
          - name: linux, avx512f+avx512bw+gfni, build only
            os: ubuntu-latest
            features: "+avx512f,+avx512bw,+gfni,+avx512vbmi"
            compile_only: true
            gfni: true
            avx512: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # The AVX-512 SHA-256 backend hands the last few messages of a batch to SHA-NI streams.
          # No other leg sets both, so this one compiles that hand-off.
          - name: linux, avx512f+avx512bw+sha, build only
            os: ubuntu-latest
            features: "+avx512f,+avx512bw,+sha,+sse4.1"
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # The inversion's repeated-squaring kernel also needs PCLMULQDQ and AVX-512 VBMI.
          # No other leg sets both, so this one compiles and tests that kernel.
          - name: linux, pclmulqdq+avx512vbmi+gfni, build only
            os: ubuntu-latest
            features: "+pclmulqdq,+avx512f,+avx512bw,+avx512vbmi,+gfni"
            compile_only: true
            gfni: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          - name: arm64, sve2, build only
            os: ubuntu-24.04-arm
            features: "+sve2"
            # GitHub's arm64 runners aren't guaranteed to have SVE2 hardware,
            # so this leg only verifies the SVE2 paths compile.
            compile_only: true
            target: aarch64-unknown-linux-gnu
            modes: serial parallel
    runs-on: ${{ matrix.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs.rust == 'true' }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.plan.outputs.rust == 'true' }}
        id: rs-stable
        with:
          # The minimal profile ships no clippy, and the build-only legs lint too.
          components: clippy

      - name: Set flags
        if: ${{ needs.plan.outputs.rust == 'true' && matrix.features }}
        run: |
          # Append the leg's target features to existing flags so we keep -C debuginfo=0.
          echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      # Smarter cache for Rust builds; avoids overfilling the runner disk.
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.plan.outputs.rust == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # nextest schedules every test from every binary in one pool instead of
      # running binaries one at a time, so idle cores get filled by other
      # crates' tests while a single long-running test is still executing.
      - uses: taiki-e/install-action@v2
        if: >-
          needs.plan.outputs.rust == 'true' &&
          (!matrix.compile_only ||
           (matrix.sha_ni && needs.plan.outputs.sha_ni == 'true') ||
           (matrix.gfni && needs.plan.outputs.gfni == 'true') ||
           (matrix.avx512 && needs.plan.outputs.avx512 == 'true'))
        with:
          tool: cargo-nextest

      - name: Test
        if: >-
          needs.plan.outputs.rust == 'true' &&
          !matrix.compile_only &&
          contains(matrix.modes, 'serial')
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py test
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Test doctests
        if: >-
          needs.plan.outputs.rust == 'true' &&
          !matrix.compile_only &&
          contains(matrix.modes, 'serial')
        # nextest doesn't run doctests, so cover them with plain `cargo test`.
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py doctest
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Test with parallel
        if: >-
          !matrix.compile_only &&
          contains(matrix.modes, 'parallel') &&
          needs.plan.outputs.rust == 'true' &&
          needs.plan.outputs.parallel == 'true'
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py test --parallel
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Test with parallel doctests
        if: >-
          !matrix.compile_only &&
          contains(matrix.modes, 'parallel') &&
          needs.plan.outputs.rust == 'true' &&
          needs.plan.outputs.parallel == 'true'
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py doctest --parallel
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Build and lint
        if: >-
          matrix.compile_only &&
          contains(matrix.modes, 'serial') &&
          needs.plan.outputs.rust == 'true'
        # Keep target-feature RUSTFLAGS off host build scripts and proc macros.
        # Clippy runs here too, since the baseline lint job cannot reach gated code.
        run: >-
          python3 scripts/check.py architecture --target ${{ matrix.target }}
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Build and lint with parallel
        if: >-
          matrix.compile_only &&
          contains(matrix.modes, 'parallel') &&
          needs.plan.outputs.rust == 'true' &&
          needs.plan.outputs.parallel == 'true'
        run: >-
          python3 scripts/check.py architecture --target ${{ matrix.target }} --parallel
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Test keccak (aarch64, no SHA3)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.os == 'macos-latest' &&
          needs.plan.outputs.keccak == 'true'
        env:
          RUSTFLAGS: -C debuginfo=0 -C target-feature=-sha3
        run: python3 scripts/check.py test --package p3-keccak

      # Apple silicon always has `sha3`, so the three-way exclusive or the NEON kernels take is
      # `EOR3` there. This run turns it off to cover the two-instruction fallback.
      - name: Test binary-field (aarch64, no SHA3)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.os == 'macos-latest' &&
          needs.plan.outputs.binary_field == 'true'
        env:
          RUSTFLAGS: -C debuginfo=0 -C target-feature=-sha3
        run: python3 scripts/check.py test --package p3-binary-field

      # `+sha` also makes `sha2` emit SHA-NI unconditionally, so every SHA-256 test here
      # needs the instructions rather than just the four-lane kernel under test.
      - name: Test sha256 (x86-64 SHA-NI)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.sha_ni &&
          needs.plan.outputs.sha_ni == 'true'
        run: |
          if grep -qw sha_ni /proc/cpuinfo; then
            python3 scripts/check.py test --package p3-sha256
          else
            echo "This runner has no SHA-NI; the build above is the coverage."
          fi

      # The field and ring-switch tests exercise their packed kernels only on a runner with
      # the instructions. The 512-bit ring-switch kernel also needs AVX-512F and AVX-512BW, and
      # the sliced zerocheck's plane-fold transposes also need AVX-512 VBMI.
      #
      # Every feature the leg sets is checked, since the binary runs none of them conditionally.
      - name: Test binary-field and sumcheck (x86-64 GFNI)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.gfni &&
          needs.plan.outputs.gfni == 'true'
        run: |
          supported=true
          for feature in $(tr ',+' '  ' <<< "${{ matrix.features }}"); do
            grep -qw "$feature" /proc/cpuinfo || supported=false
          done
          if $supported; then
            python3 scripts/check.py test --package p3-binary-field
            if grep -q avx512bw <<< "${{ matrix.features }}"; then
              cargo test -p p3-sumcheck --lib ring_switch::bits
            fi
            if grep -q avx512vbmi <<< "${{ matrix.features }}"; then
              cargo test -p p3-multi-stark --lib sliced
            fi
          else
            echo "This runner lacks the required SIMD features; the build above is the coverage."
          fi

      # Miri cannot run the `asm!` of the AVX-512 kernels, so only the processor can.
      #
      # This leg compiles those kernels in, so their tests pin them to the reference on a runner that has them.
      #
      # Every feature the leg sets is checked, since the binary runs none of them conditionally.
      - name: Test blake3 and sha256 (x86-64 AVX-512)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.avx512 &&
          needs.plan.outputs.avx512 == 'true'
        run: |
          supported=true
          for feature in $(tr ',+' '  ' <<< "${{ matrix.features }}"); do
            grep -qw "$feature" /proc/cpuinfo || supported=false
          done
          if $supported; then
            python3 scripts/check.py test --package p3-blake3 --package p3-sha256
          else
            echo "This runner lacks the required SIMD features; the build above is the coverage."
          fi

      # Whatever the runner's own processor is, the interpreter has shims for the three
      # byte-wise field instructions, so the corner differential against the scalar model
      # runs on every host.
      #
      # One deterministic test rather than the module: the proptests around it take minutes
      # under interpretation.
      #
      # Where the leg also sets PCLMULQDQ, the repeated-squaring kernel's basis test runs too.
      # The map is linear, so agreeing on the 64 basis vectors settles every input.
      - uses: dtolnay/rust-toolchain@master
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.gfni &&
          needs.plan.outputs.gfni == 'true'
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri

      - name: Interpret binary-field (x86-64 GFNI)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.gfni &&
          needs.plan.outputs.gfni == 'true'
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo "+$MIRI_TOOLCHAIN" miri test --package p3-binary-field --lib \
            aes::packed::tests::every_width_agrees_with_the_scalar_routines_at_the_corners
          if grep -q pclmulqdq <<< "${{ matrix.features }}"; then
            cargo "+$MIRI_TOOLCHAIN" miri test --package p3-binary-field --lib \
              clmul::x86_64::gfni::tests::the_matrix_product_is_exact_on_the_basis
          fi

      # Neither wide carryless-multiply leg can run its tests on the runner's own processor.
      #
      # The interpreter has shims for the 256- and 512-bit `vpclmulqdq` and for every lane move the packings use.
      #
      # So the corner differentials, the interleaves, the transposes and the shared extension suite run here, on every host.
      #
      # The proptests around them take minutes under interpretation, so they stay out.
      #
      # The `avx512vl` leg stays out too: the interpreter has no shim for its ternary logic op.
      - uses: dtolnay/rust-toolchain@master
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.miri_clmul &&
          needs.plan.outputs.gfni == 'true'
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri

      - name: Interpret binary-field (x86-64 VPCLMULQDQ)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.miri_clmul &&
          needs.plan.outputs.gfni == 'true'
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo "+$MIRI_TOOLCHAIN" miri test --package p3-binary-field --lib -- --exact \
            packed::x86_64::ghash128::tests::the_register_matches_the_scalar_model_at_the_corners \
            packed::x86_64::ghash128::tests::bool_check_matches_the_general_product_in_every_lane \
            packed::x86_64::ghash128::tests::packed_field_tests::test_interleaves \
            packed::poly64::tests::every_lane_matches_the_scalar_field_at_the_corners \
            packed::poly64::tests::packed_field_tests::test_interleaves \
            packed::poly192::tests::every_lane_matches_the_scalar_field_at_the_corners \
            packed::poly192::tests::the_shared_packed_extension_suite_passes \
            packed::x86_64::lanes::triples::tests::the_plans_round_trip_at_both_widths

      - name: Lint optional eight-lane polynomial packing
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.features == '+avx512f,+vpclmulqdq'
        env:
          RUSTFLAGS: -C debuginfo=0 -C target-feature=+avx512f,+avx512bw,+vpclmulqdq
        run: cargo +stable clippy --target x86_64-unknown-linux-gnu --all-targets --package p3-binary-field --features wide-poly -- -D warnings

      # The interpreter has shims for the 256-bit carryless multiply, so the `Poly64` butterfly's register kernel runs on every host.
      #
      # The 512-bit arm stays build-only, since the interpreter has no shim for its ternary logic.
      #
      # One deterministic corner sweep rather than the module, as the proptests take minutes under interpretation.
      - uses: dtolnay/rust-toolchain@master
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.vpclmulqdq &&
          needs.plan.outputs.vpclmulqdq == 'true'
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri

      - name: Interpret binary-dft (x86-64 AVX2 VPCLMULQDQ)
        if: >-
          needs.plan.outputs.rust == 'true' &&
          matrix.vpclmulqdq &&
          needs.plan.outputs.vpclmulqdq == 'true'
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo "+$MIRI_TOOLCHAIN" miri test --package p3-binary-dft --lib \
            butterfly::tests::the_polynomial_basis_level_agrees_with_the_element_loop_at_the_corners

  check_embedded:
    name: Build embedded
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      needs.plan.outputs.embedded == 'true' &&
      !contains(toJSON(github.event.commits.*.message), '[skip-ci]')

    env:
      target: thumbv7em-none-eabi

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Library packages are discovered through Cargo metadata. Host-only packages
      # explicitly opt out with `package.metadata.plonky3.embedded = false`.
      - name: Build
        run: >-
          python3 scripts/check.py embedded --target ${{ env.target }}
          --packages "${{ needs.plan.outputs.packages }}"

  check_wasm32_simd128:
    name: Test wasm32 simd128
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      (needs.plan.outputs.wasm == 'true' || needs.plan.outputs.wasm_blake3 == 'true') &&
      !contains(toJSON(github.event.commits.*.message), '[skip-ci]')
    env:
      # Compile-coverage target for browser-style consumers.
      build_target: wasm32-unknown-unknown
      # Runtime target — wasi exposes the syscalls (clock, write) wasmtime needs
      # to actually execute the SIMD tests and the smoke/bench binaries.
      run_target: wasm32-wasip1
      RUSTFLAGS: -C debuginfo=0 -C target-feature=+simd128
      # Tell cargo to invoke the built `.wasm` via wasmtime.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.build_target }}, ${{ env.run_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v44.0.1
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSL --retry 5 --retry-connrefused "$url" -o /tmp/wasmtime.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME"
          echo "$HOME/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Build p3-goldilocks for wasm32-unknown-unknown
        if: needs.plan.outputs.wasm == 'true'
        run: python3 scripts/check.py wasm --step build --build-target ${{ env.build_target }}
      - name: Run wasm32+simd128 SIMD tests under wasmtime
        if: needs.plan.outputs.wasm == 'true'
        run: python3 scripts/check.py wasm --step test --run-target ${{ env.run_target }}
      - name: Run wasm_smoke under wasmtime
        if: needs.plan.outputs.wasm == 'true'
        run: python3 scripts/check.py wasm --step smoke --run-target ${{ env.run_target }}
      - name: Run wasm_bench under wasmtime
        if: needs.plan.outputs.wasm == 'true'
        run: python3 scripts/check.py wasm --step bench --run-target ${{ env.run_target }}
      - name: Run wasm_merkle_bench under wasmtime
        if: needs.plan.outputs.wasm == 'true'
        run: python3 scripts/check.py wasm --step merkle --run-target ${{ env.run_target }}
      # The batched BLAKE3 kernel has a SIMD128 backend, so its tests pin that backend to upstream.
      - name: Test p3-blake3 under wasmtime
        if: needs.plan.outputs.wasm_blake3 == 'true'
        run: python3 scripts/check.py wasm --step blake3 --run-target ${{ env.run_target }}

  lint:
    name: Formatting and Clippy
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      needs.plan.outputs.lint == 'true' &&
      !contains(toJSON(github.event.commits.*.message), '[skip-ci]')

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.plan.outputs.rust == 'true' || needs.plan.outputs.manifests == 'true' }}
        with:
          components: clippy
        id: rs-stable

      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ needs.plan.outputs.rust == 'true' }}
        with:
          components: rustfmt

      - uses: taiki-e/install-action@v2
        if: >-
          needs.plan.outputs.rust == 'true' ||
          needs.plan.outputs.manifests == 'true'
        with:
          tool: cargo-machete

      - uses: taiki-e/install-action@v2
        if: ${{ needs.plan.outputs.manifests == 'true' }}
        with:
          tool: cargo-sort

      - uses: taiki-e/install-action@v2
        if: ${{ needs.plan.outputs.toml == 'true' }}
        with:
          tool: taplo

      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.plan.outputs.rust == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test repository command interface
        if: ${{ needs.plan.outputs.scripts == 'true' }}
        run: python3 scripts/check.py lint --check scripts

      - name: Sort Cargo.toml
        if: ${{ needs.plan.outputs.manifests == 'true' }}
        run: python3 scripts/check.py lint --check sort

      - name: Check TOML formatting
        if: ${{ needs.plan.outputs.toml == 'true' }}
        run: python3 scripts/check.py lint --check toml

      # `--with-metadata` resolves each manifest through cargo.
      # Only that resolution makes dev-dependencies visible to the scan.
      - name: Unused dependencies
        if: >-
          needs.plan.outputs.rust == 'true' ||
          needs.plan.outputs.manifests == 'true'
        run: python3 scripts/check.py lint --check deps

      - name: Clippy
        if: ${{ needs.plan.outputs.rust == 'true' }}
        run: >-
          python3 scripts/check.py lint --check clippy
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Docs
        if: ${{ needs.plan.outputs.rust == 'true' }}
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: >-
          python3 scripts/check.py lint --check docs
          --packages "${{ needs.plan.outputs.packages }}"

      - name: Format
        if: ${{ needs.plan.outputs.rust == 'true' }}
        run: >-
          python3 scripts/check.py lint --check fmt
          --packages "${{ needs.plan.outputs.packages }}"
