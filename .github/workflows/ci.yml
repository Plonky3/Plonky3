name: CI

on:
  # Release-plz verifies CI on the post-merge commit of the base branch, so
  # push CI must run on every branch that can host a release: main, the
  # vX.Y.Z stable branches, and the X.Y.Z-rc.N release-candidate branches
  # created by create_release.sh (named after the rc version, no "v" prefix).
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
  # Optimize the test profile while retaining its debug assertions and overflow
  # checks, so compute-heavy correctness tests (full proofs, large polynomial
  # sweeps) don't pay the cost of a fully unoptimized build. The heavy,
  # unrelated curve-arithmetic crates a p3-bn254 dev-dependency pulls in are
  # excluded via per-package profile overrides in the root Cargo.toml.
  CARGO_PROFILE_TEST_OPT_LEVEL: 1

jobs:
  build_and_test:
    name: Build and Test (${{ matrix.name }})
    strategy:
      matrix:
        include:
          # `modes` selects which of the default and `parallel`-feature runs a leg
          # performs. A leg naming both runs them as sequential steps sharing one
          # warm target directory.
          - name: linux
            os: ubuntu-latest
            modes: serial
          - name: linux, parallel
            os: ubuntu-latest
            modes: parallel
          - name: linux, avx2
            os: ubuntu-latest
            features: "+avx2"
            modes: serial
          - name: linux, avx2, parallel
            os: ubuntu-latest
            features: "+avx2"
            modes: parallel
          # PCLMULQDQ is present on essentially every x86_64 CPU since ~2010, so the
          # carryless-multiply paths can be tested rather than merely compiled.
          - name: linux, pclmulqdq
            os: ubuntu-latest
            features: "+pclmulqdq"
            modes: serial parallel
          # The serial/parallel split belongs on the Linux legs above: it exercises
          # `maybe-rayon`, whose two backends do not vary by operating system. The
          # macOS and Windows legs run the `parallel` configuration consumers ship.
          - name: macos, parallel
            os: macos-latest
            modes: parallel
          - name: windows, parallel
            os: windows-latest
            modes: parallel
          # A leg's job name is its `name`, and most of them are required status
          # checks, so renaming one leaves a required check that is never reported.
          # New feature combinations go in legs of their own.
          - name: linux, avx512f, build only
            os: ubuntu-latest
            features: "+avx512f"
            # GitHub-hosted runners aren't guaranteed to have AVX-512 hardware,
            # so this leg only verifies the AVX-512 paths compile.
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          # VPCLMULQDQ, the 256- and 512-bit carryless multiply, arrived with Ice Lake and
          # Zen 3. GitHub's runner pool still includes older parts, so these legs compile the
          # wide carryless-multiply paths rather than running them.
          #
          # A user-mode emulator is not a way around that. QEMU's translator decodes the
          # 128-bit carryless multiply only, so every test reaching a 256-bit product dies
          # on an illegal instruction. Executing these paths needs real silicon.
          - name: linux, avx2+vpclmulqdq, build only
            os: ubuntu-latest
            features: "+avx2,+vpclmulqdq"
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          - name: linux, avx512f+vpclmulqdq, build only
            os: ubuntu-latest
            features: "+avx512f,+vpclmulqdq"
            compile_only: true
            target: x86_64-unknown-linux-gnu
            modes: serial parallel
          - name: arm64, sve2, build only
            os: ubuntu-24.04-arm
            features: "+sve2"
            # GitHub's arm64 runners aren't guaranteed to have SVE2 hardware,
            # so this leg only verifies the SVE2 paths compile.
            compile_only: true
            target: aarch64-unknown-linux-gnu
            modes: serial parallel
    runs-on: ${{ matrix.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Set flags
        if: ${{ matrix.features }}
        run: |
          # Append the leg's target features to existing flags so we keep -C debuginfo=0.
          echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      # Smarter cache for Rust builds; avoids overfilling the runner disk.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # nextest schedules every test from every binary in one pool instead of
      # running binaries one at a time, so idle cores get filled by other
      # crates' tests while a single long-running test is still executing.
      - uses: taiki-e/install-action@v2
        if: ${{ !matrix.compile_only }}
        with:
          tool: cargo-nextest

      - name: Test
        if: ${{ !matrix.compile_only && contains(matrix.modes, 'serial') }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py test

      - name: Test doctests
        if: ${{ !matrix.compile_only && contains(matrix.modes, 'serial') }}
        # nextest doesn't run doctests, so cover them with plain `cargo test`.
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py doctest

      - name: Test with parallel
        if: ${{ !matrix.compile_only && contains(matrix.modes, 'parallel') }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py test --parallel

      - name: Test with parallel doctests
        if: ${{ !matrix.compile_only && contains(matrix.modes, 'parallel') }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py doctest --parallel

      - name: Build
        if: ${{ matrix.compile_only && contains(matrix.modes, 'serial') }}
        # Keep target-feature RUSTFLAGS off host build scripts and proc macros.
        run: python3 scripts/check.py architecture --target ${{ matrix.target }}

      - name: Build with parallel
        if: ${{ matrix.compile_only && contains(matrix.modes, 'parallel') }}
        run: python3 scripts/check.py architecture --target ${{ matrix.target }} --parallel

      - name: Test keccak (aarch64, no SHA3)
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          RUSTFLAGS: -C debuginfo=0 -C target-feature=-sha3
        run: python3 scripts/check.py test --package p3-keccak

  check_embedded:
    name: Build embedded
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    env:
      target: thumbv7em-none-eabi

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
        id: rs-stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Library packages are discovered through Cargo metadata. Host-only packages
      # explicitly opt out with `package.metadata.plonky3.embedded = false`.
      - name: Build
        run: python3 scripts/check.py embedded --target ${{ env.target }}

  check_wasm32_simd128:
    name: Test wasm32 simd128
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    env:
      # Compile-coverage target for browser-style consumers.
      build_target: wasm32-unknown-unknown
      # Runtime target — wasi exposes the syscalls (clock, write) wasmtime needs
      # to actually execute the SIMD tests and the smoke/bench binaries.
      run_target: wasm32-wasip1
      RUSTFLAGS: -C debuginfo=0 -C target-feature=+simd128
      # Tell cargo to invoke the built `.wasm` via wasmtime.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.build_target }}, ${{ env.run_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v44.0.1
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSL --retry 5 --retry-connrefused "$url" -o /tmp/wasmtime.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME"
          echo "$HOME/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Build p3-goldilocks for wasm32-unknown-unknown
        run: python3 scripts/check.py wasm --step build --build-target ${{ env.build_target }}
      - name: Run wasm32+simd128 SIMD tests under wasmtime
        run: python3 scripts/check.py wasm --step test --run-target ${{ env.run_target }}
      - name: Run wasm_smoke under wasmtime
        run: python3 scripts/check.py wasm --step smoke --run-target ${{ env.run_target }}
      - name: Run wasm_bench under wasmtime
        run: python3 scripts/check.py wasm --step bench --run-target ${{ env.run_target }}
      - name: Run wasm_merkle_bench under wasmtime
        run: python3 scripts/check.py wasm --step merkle --run-target ${{ env.run_target }}

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        id: rs-stable

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Prebuilt binaries instead of `cargo install`, which compiles both
      # tools (and taplo's `time` dependency chain) from source every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-sort,taplo

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test repository command interface
        run: python3 scripts/check.py lint --check scripts

      - name: Sort Cargo.toml
        run: python3 scripts/check.py lint --check sort

      - name: Check TOML formatting
        run: python3 scripts/check.py lint --check toml

      # `--with-metadata` resolves each manifest through cargo.
      # Only that resolution makes dev-dependencies visible to the scan.
      - name: Unused dependencies
        run: python3 scripts/check.py lint --check deps

      - name: Clippy
        run: python3 scripts/check.py lint --check clippy

      - name: Docs
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: python3 scripts/check.py lint --check docs

      - name: Format
        run: python3 scripts/check.py lint --check fmt
