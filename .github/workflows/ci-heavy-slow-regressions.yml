name: Heavy CI (slow regressions)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [ "*" ]
    paths:
      - "whir/src/**"
      - "circle/src/**"
      - "fri/src/**"
      - "batch-stark/**"
      - "multilinear-util/src/**"
      - "multi-stark/src/**"
      - "multi-stark/tests/**"
      - "bus/src/**"
      - "uni-stark/src/**"
      - "uni-stark/tests/**"
      - "binary-dft/src/**"
      - "binary-dft/tests/**"
      - "stir/src/**"
      - "stir/tests/**"
      - "examples/src/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  slow_regressions:
    name: Slow regression tests
    env:
      # Optimize these compute-heavy tests while retaining the test profile's
      # debug assertions and overflow checks. Scoped per-package (never a
      # bare workspace-wide `cargo test`/`nextest run`), so this never touches
      # p3-bn254's zkhash dev-dependency and the ark-ff/halo2 tree it pulls
      # in, which is expensive to optimize and unrelated to any of these
      # tests.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test slow regressions
        run: python3 scripts/check.py slow-regressions
