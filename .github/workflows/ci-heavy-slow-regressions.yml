name: Heavy CI (slow regressions)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  # Every pull request plans its run; a regression runs only when the change reaches its package.
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  slow_regressions:
    name: Slow regression tests
    env:
      # Optimize these compute-heavy tests while retaining the test profile's
      # debug assertions and overflow checks. Scoped per-package (never a
      # bare workspace-wide `cargo test`/`nextest run`), so this never touches
      # p3-bn254's zkhash dev-dependency and the ark-ff/halo2 tree it pulls
      # in, which is expensive to optimize and unrelated to any of these
      # tests.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # The same selection as the main CI: changed packages, their dependents and their direct
      # dev consumers. Scheduled and manual runs take every package.
      - name: Select affected packages
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/check.py plan --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/check.py plan --full --github-output "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.impact.outputs.rust == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test slow regressions
        if: ${{ steps.impact.outputs.rust == 'true' }}
        run: >-
          python3 scripts/check.py slow-regressions
          --packages "${{ steps.impact.outputs.packages }}"
