name: Heavy CI (WHIR exhaustive)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  whir_exhaustive:
    name: WHIR exhaustive tests
    env:
      # Optimize the exhaustive sweep while retaining the test profile's
      # debug assertions and overflow checks.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        id: rs-stable

      - name: Select affected packages
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/check.py plan --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/check.py plan --full --github-output "$GITHUB_OUTPUT"
          fi

      - name: Set flags
        if: ${{ matrix.features }}
        run: |
          # Append AVX2 to existing flags so we keep -C debuginfo=0.
          echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=${{ matrix.features }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.impact.outputs.whir == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test WHIR exhaustive sweep
        if: ${{ steps.impact.outputs.whir == 'true' }}
        run: python3 scripts/check.py whir-exhaustive

      - name: Test WHIR exhaustive sweep with parallel
        if: ${{ steps.impact.outputs.whir == 'true' }}
        run: python3 scripts/check.py whir-exhaustive --parallel
