[package]
name = "p3-xmss"
description = "XMSS-style hash-based signatures over a tweakable hash: keyed-BLAKE3 signatures aggregated in binary-field Flock proofs and binary recursion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemallocator.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel", "p3-flock/parallel"]

[dependencies]
p3-challenger.workspace = true
p3-commit.workspace = true
p3-flock.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true
p3-verifier-arith.workspace = true

blake3.workspace = true
rand.workspace = true
thiserror.workspace = true

[dev-dependencies]
p3-blake3 = { path = "../blake3" }
p3-keccak = { path = "../keccak" }

postcard = { workspace = true, features = ["alloc"] }
rand = { workspace = true, features = ["std_rng"] }

[lints]
workspace = true
