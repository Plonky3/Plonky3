[package]
name = "p3-binary-pcs"
description = "Multilinear polynomial commitment over Plonky3 binary tower fields, via additive-domain proximity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# criterion pulls rayon transitively and rayon does not build on wasi.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true
rand = { workspace = true, features = ["sys_rng"] }

[package.metadata.plonky3.ci]
test-features = ["zk"]

[features]
parallel = ["p3-maybe-rayon/parallel"]
test-utils = []
zk = [
    "dep:p3-air",
    "dep:postcard",
    "dep:p3-keccak",
    "dep:p3-merkle-tree",
    "dep:p3-symmetric",
    "dep:rand",
]

[dependencies]
p3-air = { workspace = true, optional = true }
p3-binary-dft.workspace = true
p3-binary-field.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-field.workspace = true
p3-keccak = { workspace = true, optional = true }
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-merkle-tree = { workspace = true, optional = true }
p3-multilinear-util.workspace = true
p3-security.workspace = true
p3-sumcheck.workspace = true
p3-symmetric = { workspace = true, optional = true }
p3-util.workspace = true
p3-whir.workspace = true
postcard = { workspace = true, optional = true, features = ["alloc"] }
rand = { workspace = true, optional = true, features = ["std_rng"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-binary-pcs = { path = ".", features = ["test-utils"] }
p3-challenger = { path = "../challenger", features = ["test-utils"] }
p3-commit = { path = "../commit", features = ["test-utils"] }
p3-keccak = { path = "../keccak" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-symmetric = { path = "../symmetric" }

postcard = { workspace = true, features = ["alloc"] }
proptest.workspace = true
rand.workspace = true

[[bench]]
name = "pcs"
harness = false

[[bench]]
name = "packing"
harness = false

[[bench]]
name = "boolean"
harness = false

[[bench]]
name = "whir"
harness = false

[[example]]
name = "zk_air"
required-features = ["zk"]

[[example]]
name = "zk_profile"
required-features = ["zk"]

[lints]
workspace = true
